<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: single-column newsroom memo; ranked rows with source chips, two sections, notes at end */
:root{
  --bg:#1d5aa6; --on-bg:#ffffff; --on-bg-muted:#d3e3f7; --on-bg-line:rgba(255,255,255,.35); --on-bg-accent:#bfdcff;
  --surface:#ffffff; --fg:#17202b; --muted:#5b6675; --line:#dde2e8;
  --accent:#0b5cad; --accent-soft:#e6eff9; --warn:#9a5b00; --warn-soft:#fdf3e2;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c2a52; --on-bg:#eef4fc; --on-bg-muted:#a9c2e2; --on-bg-line:rgba(190,215,250,.25); --on-bg-accent:#8cc0f5;
  --surface:#14335c; --fg:#e6ebf1; --muted:#a3b3c7; --line:#27497a;
  --accent:#7ab8f5; --accent-soft:#1c406f; --warn:#f0b257; --warn-soft:#33270f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c2a52; --on-bg:#eef4fc; --on-bg-muted:#a9c2e2; --on-bg-line:rgba(190,215,250,.25); --on-bg-accent:#8cc0f5;
  --surface:#14335c; --fg:#e6ebf1; --muted:#a3b3c7; --line:#27497a;
  --accent:#7ab8f5; --accent-soft:#1c406f; --warn:#f0b257; --warn-soft:#33270f; color-scheme:dark}
body{background:var(--bg);color:var(--on-bg);margin:0;font-family:var(--sans);font-size:15px;line-height:1.6}
.wrap{max-width:920px;margin:0 auto;padding-block:32px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:36px}
header{display:flex;flex-direction:column;gap:8px;border-bottom:2px solid var(--on-bg-line);padding-bottom:18px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-bg-accent)}
h1{font-size:28px;line-height:1.3;margin:0;text-wrap:balance;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--on-bg-muted);font-size:13.5px}
.meta b{color:var(--on-bg);font-weight:600}
h2{font-size:19px;margin:0;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2 small{font-weight:400;color:var(--on-bg-muted);font-size:13px}
section{display:flex;flex-direction:column;gap:14px}
ol.rank{list-style:none;margin:0;padding:0;background:var(--surface);color:var(--fg);box-shadow:0 2px 10px rgba(0,20,60,.18);border:1px solid var(--line);border-radius:6px}
ol.rank li{display:grid;grid-template-columns:40px 1fr;gap:4px 14px;padding:16px 18px;border-top:1px solid var(--line)}
ol.rank li:first-child{border-top:0}
.no{font-family:var(--mono);font-size:20px;color:var(--accent);line-height:1.3;grid-row:span 3}
.row1{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:12px;font-weight:600;padding:1px 8px;border-radius:3px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.cnt{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ttl{font-weight:600;font-size:16px;line-height:1.45;min-width:0}
.ttl a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line)}
.ttl a:hover,.ttl a:focus-visible{border-bottom-color:var(--accent);color:var(--accent);outline:none}
.desc{color:var(--muted);font-size:14px;min-width:0}
.desc .imp{color:var(--fg)}
.desc .imp::before{content:"당사 시사점 · ";font-weight:600;color:var(--accent)}
.src{font-size:12.5px;color:var(--muted)}
.notice{background:var(--warn-soft);color:var(--fg);border-left:3px solid var(--warn);padding:10px 14px;font-size:14px;border-radius:0 4px 4px 0}
.notice b{color:var(--warn)}
.also{font-size:14px;color:var(--on-bg-muted);padding:0 2px}
.also b{color:var(--on-bg);font-weight:600}
.also a{color:var(--on-bg);text-decoration-color:var(--on-bg-line)}
.kw{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;font-size:13px}
.kw div{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;min-width:0}
.kw b{display:block;font-size:12px;color:var(--accent)}
.kw span{color:var(--muted)}
footer{border-top:1px solid var(--on-bg-line);padding-top:16px;color:var(--on-bg-muted);font-size:13px;display:flex;flex-direction:column;gap:6px}
footer ul{margin:0;padding-left:18px}
@media (max-width:520px){h1{font-size:23px}ol.rank li{grid-template-columns:30px 1fr;padding:14px}.no{font-size:17px}}
</style>

<div class="wrap">
{{BODY}}
</div>
